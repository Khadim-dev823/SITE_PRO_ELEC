<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <defs>
    <!-- Dégradé Électrique Réaliste -->
    <linearGradient id="smitBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8C00" />
    </linearGradient>
  </defs>

  <!-- Groupe Icône Industrielle + Électricité -->
  <g transform="translate(10, 8)">
    <!-- Hexagone Industriel (Symbole Maintenance & Structure) -->
    <polygon points="42,2 78,23 78,65 42,86 6,65 6,23" fill="#0D3B66" />
    
    <!-- Bordure d'accentuation électrique -->
    <polygon points="42,8 72,25 72,63 42,80 12,63 12,25" fill="none" stroke="#FFC107" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Éclair Électrique Géométrique Net -->
    <polygon points="48,15 26,48 40,48 34,73 58,38 43,38" fill="url(#smitBoltGrad)" />
  </g>

  <!-- Texte Principal : SMIT -->
  <text x="102" y="58" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="46" font-weight="900" fill="#0D3B66" letter-spacing="2">
    SMIT
  </text>

  <!-- Carré d'accentuation haute tension -->
  <rect x="245" y="24" width="12" height="12" rx="2" fill="#FFC107" />

  <!-- Sous-titre : Sen Maintenance Industrielle & Tertiaire -->
  <text x="103" y="78" font-family="'Montserrat', 'Helvetica', sans-serif" font-size="11" font-weight="700" fill="#4A5568" letter-spacing="1.2">
    SEN MAINTENANCE INDUSTRIELLE &amp; TERTIAIRE
  </text>
</svg>