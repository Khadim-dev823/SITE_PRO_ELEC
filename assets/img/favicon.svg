<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC01D" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    <linearGradient id="favSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <!-- Fond Carré Sombre pour faire ressortir l'icône sur n'importe quel thème -->
  <rect width="100" height="100" rx="22" fill="url(#favSlate)" />

  <!-- Bordure Hexagonale Jaune -->
  <polygon points="50,10 85,27 85,73 50,90 15,73 15,27" fill="none" stroke="#FFC01D" stroke-width="5" stroke-linejoin="round"/>

  <!-- Éclair Électrique Net et Brillant -->
  <polygon points="58,18 32,50 48,50 38,82 68,42 52,42" fill="url(#favNeon)" />
</svg>